[package]
name = "plumbline"
version = "0.0.1"
edition = "2021"
description = "Keep a Rust crate's shipped docs in lock-step with its real binary output, and gate cargo publish on it. crates.io is write-once; plumbline is the plumb-line that proves the docs hang true at the publish moment."
license = "Apache-2.0"
repository = "https://github.com/rgfind/plumbline"
keywords = ["cargo", "publish", "docs", "release", "contract"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
readme = "README.md"

# crate name is `plumbline`; the command is `plumb` (as beads_rust ships `br`).
[[bin]]
name = "plumb"
path = "src/main.rs"

[dependencies]
# Config, contract fixtures, and captured envelopes are all JSON. One dependency,
# same as the tool that plumbline grew out of.
serde_json = "1"
