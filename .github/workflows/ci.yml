name: CI

# plumbline guards other crates, so it must be well-guarded itself: formatting,
# lints, and the full test suite (unit tests plus the seeded-drift acceptance
# tests) on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
      - name: Record Rust toolchain
        run: rustc -Vv
      - name: Install reviewed plumbline
        run: cargo install --path . --locked --force
      - name: Verify declared CI policy
        run: plumb verify --stage=ci --json
